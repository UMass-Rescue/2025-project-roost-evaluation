# ThreatExchange commit hash (compatible with hma.patch)
# Commit: aff3f3b8
#
# Sentinel API (grooming classifier service) commit
# Repo: https://github.com/UMass-Rescue/sentinel-api
# Commit: 29c84fb9651f48d4e347fdc8e99cfcb7e7914ec7
#
# Default: CPU. For GPU: uncomment deploy below and build with:
#   PYTORCH_CUDA=cu128 docker compose build --no-cache
x-postgres-variables: &postgres-variables
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: hma-postgresql
  POSTGRES_DB: media_match

x-omm-variables: &omm-variables
  OMM_CONFIG: /reference_configs/development_omm_config.py
  OMM_DATABASE_URI: "postgresql+psycopg2://postgres:postgres@hma-postgresql/media_match"

services:
  hma-postgresql:
    image: postgres:17-alpine
    restart: unless-stopped
    volumes:
      - hma-postgres-data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    environment:
      <<: *postgres-variables
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 1s
      retries: 5
      start_period: 5s
      timeout: 10s
    networks:
      - shared-hma-network

  hma-migrations:
    build:
      context: .
      dockerfile: Dockerfile.hma
      args:
        THREATEXCHANGE_COMMIT: aff3f3b8
        PYTORCH_CUDA: ${PYTORCH_CUDA:-cpu}  # GPU: PYTORCH_CUDA=cu128
    restart: no
    environment:
      <<: *omm-variables
    depends_on:
      hma-postgresql:
        condition: service_healthy
    networks:
      - shared-hma-network
    command: /app/scripts/db-migrate.sh

  hma-app:
    build:
      context: .
      dockerfile: Dockerfile.hma
      args:
        THREATEXCHANGE_COMMIT: aff3f3b8
        PYTORCH_CUDA: ${PYTORCH_CUDA:-cpu}  # GPU: PYTORCH_CUDA=cu128 (match nvidia-smi)
    restart: unless-stopped
    ports:
      - "5005:5100"
    environment:
      <<: *omm-variables
      # Uncomment to use exact/flat search instead of HNSW (approximate)
      # CLIP_DISABLE_HNSW_INDEX: 'true'
    depends_on:
      hma-postgresql:
        condition: service_healthy
      hma-migrations:
        condition: service_completed_successfully
    networks:
      - shared-hma-network
    # GPU: uncomment deploy below (Linux + nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  sentinel-app:
    build:
      context: https://github.com/UMass-Rescue/sentinel-api.git#29c84fb9651f48d4e347fdc8e99cfcb7e7914ec7
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      # Server-side only, not a /score request param -- see sentinel/README.md.
      - SENTINEL_DEFAULT_MIN_SIZE_OF_SCORES=${SENTINEL_DEFAULT_MIN_SIZE_OF_SCORES:-5}
    volumes:
      # Shared with `evaluation` so bank-creation requests can reference
      # folder paths that resolve inside this container too -- see the
      # root README.md's "Sentinel Configuration" section.
      - sentinel-data:/data
    networks:
      - shared-hma-network

  evaluation:
    build: .
    #    command: tail -f /dev/null
    environment:
      - HMA_HOST=hma-app
      - HMA_PORT=5100
      - SENTINEL_HOST=sentinel-app
      - SENTINEL_PORT=8000
      - SENTINEL_DATA_DIR=/data
      - POSTGRES_HOST=hma-postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=media_match
    volumes:
      - .:/build
      - sentinel-data:/data
    networks:
      - shared-hma-network
    depends_on:
      - hma-app
      - hma-postgresql
      - sentinel-app

volumes:
  hma-postgres-data:
  sentinel-data:


networks:
  shared-hma-network:
    external: true
