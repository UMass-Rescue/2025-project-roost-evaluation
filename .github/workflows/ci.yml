name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.6"
          args: check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Python version of the evaluation image (Dockerfile).
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-scenedetect.txt
            hma/requirements-dev.txt
            sentinel/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r hma/requirements-dev.txt -r sentinel/requirements-dev.txt
          pip install --no-deps -r requirements-scenedetect.txt
      # The two suites share module names (test_metrics.py), so they run separately.
      - name: Unit tests
        shell: bash
        run: |
          status=0
          for suite in hma/unit_tests sentinel/tests; do
            PYTHONPATH=. python -m pytest "$suite" -v | tee pytest.log || status=$?
            echo "$suite: $(tail -n 1 pytest.log | tr -d '=')" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the evaluation image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
