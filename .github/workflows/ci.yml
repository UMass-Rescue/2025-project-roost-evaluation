name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: make lint

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Python version of the evaluation image (Dockerfile).
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-scenedetect.txt
            hma/requirements-dev.txt
            sentinel/requirements-dev.txt
      - name: Unit tests
        shell: bash
        run: |
          status=0
          make unit-test | tee pytest.log || status=$?
          grep -E '^=+ .* in [0-9.]+s' pytest.log | tr -d '=' >> "$GITHUB_STEP_SUMMARY"
          exit $status

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the evaluation image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
