name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.6"
          args: check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the Python version of the evaluation image (Dockerfile).
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            hma/requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r hma/requirements-dev.txt
          pip install --no-deps -r requirements-scenedetect.txt
      # The two suites share module names (test_metrics.py), so they run separately.
      - name: HMA unit tests
        run: |
          set -o pipefail
          status=0
          PYTHONPATH=. python -m pytest hma/unit_tests -v | tee pytest.log || status=$?
          echo "HMA: $(tail -n 1 pytest.log | tr -d '=')" >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Sentinel unit tests
        run: |
          set -o pipefail
          status=0
          PYTHONPATH=. python -m pytest sentinel/tests -v | tee pytest.log || status=$?
          echo "Sentinel: $(tail -n 1 pytest.log | tr -d '=')" >> "$GITHUB_STEP_SUMMARY"
          exit $status

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the evaluation image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
